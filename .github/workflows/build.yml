
name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: Aetherforged-0.3.0-source/Aetherforged-Playable-NeoForge-1.21.1/Aetherforged-Playable-1.21.1
        run: gradle build

      - name: Show generated JAR files
        run: find . -type f -path "*/build/libs/*.jar"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aetherforged-Mod
          path: Aetherforged-0.3.0-source/Aetherforged-Playable-NeoForge-1.21.1/Aetherforged-Playable-1.21.1/build/libs/*.jar
          if-no-files-found: error
